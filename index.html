<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple IoT World - Login & Register</title>
  <meta name="description" content="Simple IoT World - Smart IoT Monitoring and Control Web App for ESP8266 NodeMCU">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            rose: {
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
              900: '#881337',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="flex flex-col justify-between min-h-screen">

  <!-- Header with App Name & Theme Toggle -->
  <header class="w-full border-b border-rose-500/20 bg-white/70 dark:bg-zinc-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 to-rose-400 flex items-center justify-center text-white shadow-lg shadow-rose-600/30">
          <i class="fa-solid fa-microchip text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-rose-600 to-rose-400 bg-clip-text text-transparent">
            Simple IoT World
          </h1>
          <p class="text-xs text-zinc-500 dark:text-zinc-400">ESP8266 IoT Controller</p>
        </div>
      </div>

      <!-- Theme Switcher -->
      <button id="theme-toggle-btn" class="p-2.5 rounded-xl border border-rose-500/20 bg-rose-50/50 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 hover:text-rose-600 dark:hover:text-rose-400 transition-all shadow-sm" title="Toggle Light/Dark Theme">
        <i class="fa-regular fa-sun text-lg theme-icon-sun hidden"></i>
        <i class="fa-regular fa-moon text-lg theme-icon-moon"></i>
      </button>
    </div>
  </header>

  <!-- Main Content: Login & Registration Card -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <!-- Glow background accent -->
      <div class="relative">
        <div class="absolute -inset-1 bg-gradient-to-r from-rose-600 to-pink-600 rounded-3xl blur-xl opacity-20 dark:opacity-30"></div>

        <div class="glass-panel relative p-8 shadow-2xl">
          <!-- Logo / Icon -->
          <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-rose-500/10 text-rose-600 dark:text-rose-400 mb-3 border border-rose-500/20">
              <i class="fa-solid fa-wifi text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight">Portal Access</h2>
            <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">Manage your ESP8266 sensors and actuators</p>
          </div>

          <!-- Alert Notification Box -->
          <div id="auth-alert" class="hidden"></div>

          <!-- Tabs: Login vs Register -->
          <div class="flex border-b border-zinc-200 dark:border-zinc-800 mb-6">
            <button id="tab-login" class="flex-1 py-3 text-center font-semibold text-sm border-b-2 border-rose-600 text-rose-600 dark:text-rose-400 transition-colors">
              <i class="fa-solid fa-right-to-bracket mr-2"></i>Sign In
            </button>
            <button id="tab-register" class="flex-1 py-3 text-center font-semibold text-sm border-b-2 border-transparent text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors">
              <i class="fa-solid fa-user-plus mr-2"></i>Register
            </button>
          </div>

          <!-- Form 1: Login -->
          <form id="form-login" class="space-y-4">
            <div>
              <label for="login-email" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Email Address</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                  <i class="fa-regular fa-envelope"></i>
                </span>
                <input type="email" id="login-email" required placeholder="ashish@example.com"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/60 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none text-sm transition-all">
              </div>
            </div>

            <div>
              <label for="login-password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Password</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                  <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" id="login-password" required placeholder="••••••••"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/60 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none text-sm transition-all">
              </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl btn-red-gradient font-semibold text-sm flex items-center justify-center gap-2 mt-6">
              <span>Sign In to Dashboard</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>

            <p class="text-center text-xs text-zinc-500 dark:text-zinc-400 pt-2">
              Don't have an account? 
              <a href="#" id="go-to-register" class="text-rose-600 dark:text-rose-400 font-semibold hover:underline">Create an account</a>
            </p>
          </form>

          <!-- Form 2: Register -->
          <form id="form-register" class="space-y-4 hidden">
            <div>
              <label for="reg-name" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Full Name</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                  <i class="fa-regular fa-user"></i>
                </span>
                <input type="text" id="reg-name" required placeholder="Ashish Kumar"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/60 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none text-sm transition-all">
              </div>
            </div>

            <div>
              <label for="reg-email" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Email Address</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                  <i class="fa-regular fa-envelope"></i>
                </span>
                <input type="email" id="reg-email" required placeholder="ashish@example.com"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/60 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none text-sm transition-all">
              </div>
            </div>

            <div>
              <label for="reg-password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Password</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                  <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" id="reg-password" required placeholder="Minimum 6 characters"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/60 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none text-sm transition-all">
              </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl btn-red-gradient font-semibold text-sm flex items-center justify-center gap-2 mt-6">
              <span>Create Account</span>
              <i class="fa-solid fa-check text-xs"></i>
            </button>

            <p class="text-center text-xs text-zinc-500 dark:text-zinc-400 pt-2">
              Already have an account? 
              <a href="#" id="go-to-login" class="text-rose-600 dark:text-rose-400 font-semibold hover:underline">Sign In</a>
            </p>
          </form>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer with Animated Heart -->
  <footer class="w-full border-t border-rose-500/10 py-5 text-center text-xs text-zinc-500 dark:text-zinc-400 bg-white/40 dark:bg-zinc-900/40">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-center gap-1.5 flex-wrap">
      <span>Developed with</span>
      <span class="heart-beat">
        <i class="fa-solid fa-heart text-rose-500"></i>
      </span>
      <span>by Rohit and Team. Department of ETC, SB Jain, Nagpur</span>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
